[versions]
agp = "9.1.1"
kotlin = "2.4.10"

coroutines = "1.11.0"
xposed = "82"
revengeApi = "1.0.0"

compileSdk = "36"
minSdk = "24"
targetSdk = "36"
# 21, not the template's 25: d8 in build-tools 36 cannot read Java 25 class files
# ("Unsupported class file major version 69"), which fails dexJar.
javaVersion = "21"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed" }
revenge-api = { module = "io.github.revenge:api", version.ref = "revengeApi" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
